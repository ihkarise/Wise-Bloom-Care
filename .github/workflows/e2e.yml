name: E2E (staging smoke)

# Real browser end-to-end against the deployed staging system
# (GitHub Pages -> Apps Script /exec -> Google Sheet). Runs on a GitHub runner,
# which can reach github.io and script.google.com. Synthetic data only; no
# mocks, no localhost. Triggered manually, and automatically after a successful
# Pages deploy.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Pages (frontend)']
    types: [completed]

permissions:
  contents: read

jobs:
  e2e:
    name: playwright smoke (deployed)
    # Manual dispatch, or only after a *successful* Pages deploy.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMP DIAGNOSTIC (removed before merge): probe the deployed Apps Script
      # /exec directly from the runner (which can reach script.google.com) to
      # tell a backend-config failure apart from a frontend transport bug.
      # Synthetic data only; hits only the public /exec URL; no secrets.
      - name: Backend transport probe (direct /exec, diagnostic)
        env:
          API: 'https://script.google.com/macros/s/AKfycbxGTss7Hpkul4y299TGsTxQj2F26k2DhbHOp9TdvzrLwZJ9b183b5HOUtq6Iu700Cpx/exec'
        run: |
          set +e
          TS=$(date +%s)
          echo "=== A. Protected GET, correct GAS mechanism (path as query param) — expect an 'unauthenticated' JSON envelope if config is healthy ==="
          curl -sS -i -L "$API?path=%2Fv1%2Ftimeline&correlationId=probe-$TS" | head -50
          echo; echo
          echo "=== B. Register POST, correct GAS mechanism (path query param + text/plain JSON body) — expect a JSON user/session envelope if config is healthy ==="
          curl -sS -i -L -X POST \
            -H "Content-Type: text/plain;charset=UTF-8" \
            --data "{\"email\":\"wb-probe-$TS@example.com\",\"password\":\"Synthetic-Passw0rd!\",\"disclaimer_ack\":true,\"maternal_name\":\"Probe Mother\"}" \
            "$API?path=%2Fv1%2Fauth%2Fregister&correlationId=probe-$TS&idempotencyKey=probe-$TS" | head -80
          echo; echo
          echo "=== C. Register POST, OLD buggy mechanism (route in the pathname, no path param) — expected to resolve to POST / => not_found ==="
          curl -sS -i -L -X POST \
            -H "Content-Type: text/plain;charset=UTF-8" \
            --data "{\"email\":\"wb-probe2-$TS@example.com\",\"password\":\"Synthetic-Passw0rd!\",\"disclaimer_ack\":true,\"maternal_name\":\"Probe Mother\"}" \
            "$API/v1/auth/register?correlationId=probe2-$TS&idempotencyKey=probe2-$TS" | head -80
          echo; echo "=== probe done ==="
          exit 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Sprint 02 staging smoke test
        working-directory: e2e
        env:
          E2E_BASE_URL: 'https://ihkarise.github.io/Wise-Bloom-Care'
          # The dev Web App /exec in the DEV_SCRIPT_ID project (ANYONE_ANONYMOUS).
          E2E_API_URL: 'https://script.google.com/macros/s/AKfycbxGTss7Hpkul4y299TGsTxQj2F26k2DhbHOp9TdvzrLwZJ9b183b5HOUtq6Iu700Cpx/exec'
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
