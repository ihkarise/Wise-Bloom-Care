name: E2E (staging smoke)

# Real browser end-to-end against the deployed staging system
# (GitHub Pages -> Apps Script /exec -> Google Sheet). Runs on a GitHub runner,
# which can reach github.io and script.google.com. Synthetic data only; no
# mocks, no localhost. Triggered manually, and automatically after a successful
# Pages deploy.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Pages (frontend)']
    types: [completed]

permissions:
  contents: read

jobs:
  e2e:
    name: playwright smoke (deployed)
    # Manual dispatch, or only after a *successful* Pages deploy.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # TEMP (removed before merge): prove the deployed backend is healthy
      # anonymously, independently of the frontend — a direct /exec register +
      # protected-GET round-trip. Synthetic data only; any session token is
      # redacted before logging; no secrets are printed.
      - name: Anonymous backend smoke (direct /exec)
        env:
          API: 'https://script.google.com/macros/s/AKfycbxGTss7Hpkul4y299TGsTxQj2F26k2DhbHOp9TdvzrLwZJ9b183b5HOUtq6Iu700Cpx/exec'
        run: |
          set -uo pipefail
          TS=$(date +%s)
          echo "=== 1) Protected GET (no token) — expect an 'unauthenticated' JSON envelope ==="
          GET_BODY=$(curl -sS -L "$API?path=%2Fv1%2Ftimeline&correlationId=smoke-$TS")
          echo "$GET_BODY" | head -c 400; echo
          echo "$GET_BODY" | grep -q '"unauthenticated"' \
            && echo "PASS: protected route requires auth (code running, anonymous access OK)" \
            || { echo "FAIL: expected an unauthenticated envelope — see body above"; exit 1; }
          echo
          echo "=== 2) Anonymous registration — real Sheet write (Script Properties + round-trip) ==="
          REG_BODY=$(curl -sS -L -X POST \
            -H "Content-Type: text/plain;charset=UTF-8" \
            --data "{\"email\":\"wb-smoke-$TS@example.com\",\"password\":\"Synthetic-Passw0rd!\",\"disclaimer_ack\":true,\"maternal_name\":\"Smoke Mother\"}" \
            "$API?path=%2Fv1%2Fauth%2Fregister&correlationId=smoke-$TS&idempotencyKey=smoke-$TS")
          # Redact any token before logging; coded error envelopes carry no secrets.
          echo "$REG_BODY" | sed -E 's/("token"[[:space:]]*:[[:space:]]*")[^"]+"/\1<redacted>"/g' | head -c 700; echo
          if echo "$REG_BODY" | grep -q '"session"' && echo "$REG_BODY" | grep -q '"token"'; then
            echo "PASS: registration created a session — SPREADSHEET_ID + EMAIL_PEPPER OK, Sheet write OK, anonymous access OK"
          else
            echo "FAIL: registration did not return a session — see body above"; exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install Playwright + Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Sprint 02 staging smoke test
        working-directory: e2e
        env:
          E2E_BASE_URL: 'https://ihkarise.github.io/Wise-Bloom-Care'
          # The dev Web App /exec in the DEV_SCRIPT_ID project (ANYONE_ANONYMOUS).
          E2E_API_URL: 'https://script.google.com/macros/s/AKfycbxGTss7Hpkul4y299TGsTxQj2F26k2DhbHOp9TdvzrLwZJ9b183b5HOUtq6Iu700Cpx/exec'
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore
