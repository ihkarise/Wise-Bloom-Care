name: Deploy Pages (frontend)

# Publishes the static Astro frontend to GitHub Pages
# (https://ihkarise.github.io/Wise-Bloom-Care/). Frontend only — the backend is
# the Google Apps Script Web App (docs/04-Architecture/50, 51); this workflow
# never touches it. The build bakes in the public API base URL (the Apps Script
# /exec URL) via PUBLIC_API_BASE_URL; Astro's `base` handles the project path.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

# Least-privilege token for the official Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build astro (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # PUBLIC_API_BASE_URL is public config (docs/04-Architecture/60 §4), not a
      # secret: it is the browser's backend endpoint. Sourced from the repo
      # variable when set, with the dev Apps Script /exec URL as the fallback so a
      # build never silently falls back to localhost.
      - name: Build frontend
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL || 'https://script.google.com/macros/s/AKfycbwVeKvG_E-B--ly4uRYC6gRd7facrRqydAIJKxcM7NVfXT2hvHghlKXK_gvzkH1H6oe/exec' }}
        run: pnpm --filter @wise-bloom/web build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: deploy to github-pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
