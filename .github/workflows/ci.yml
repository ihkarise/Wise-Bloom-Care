name: CI

# Green CI on an empty-but-wired build is the Sprint 00 deliverable and gate G-0
# (docs/20-Implementation/205 §7/§8, 202 §7). Order: lint → type-check → test → build.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · type-check · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Boundary lint rules run here across the repo and fail the build on any
      # SpreadsheetApp use outside the adapter or network call outside api/
      # (docs/04-Architecture/51 BR-1, 53 BR-1; 205 §8).
      - name: Lint
        run: |
          pnpm lint
          pnpm -r lint

      - name: Type-check
        run: pnpm -r typecheck

      # Includes the boundary-rule meta-tests (RuleTester) that trip on planted
      # violations, and the adapter round-trip + PHI-safe logging tests (205 §9).
      - name: Test
        run: pnpm -r test

      - name: Build
        run: pnpm -r build

  secret-scan:
    name: secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # No secrets in the repo (docs/04-Architecture/60 BR-3, docs/09-Security/124;
      # 214 §4.4). Guards against committed .clasp.json / .env / credentials.
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
